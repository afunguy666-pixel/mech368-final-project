name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-host.sh
      - run: bash scripts/run-sil.sh
  firmware-sim:
    runs-on: ubuntu-24.04
    # Informational until the remote/robot timer-phase issue in
    # docs/SIMULATOR.md is resolved; remove continue-on-error afterwards.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/run-fw-sim.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fwsim-reports
          path: build/fwsim/
  firmware-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'
      - run: |
          arduino-cli core update-index
          arduino-cli core install arduino:mbed_nano@4.4.1
          arduino-cli lib install ArduinoBLE@1.4.1
      - run: bash scripts/compile-firmware.sh
