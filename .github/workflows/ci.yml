name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-host.sh
      - run: bash scripts/run-sil.sh
  firmware-sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/run-fw-sim.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fwsim-reports
          path: build/fwsim/
  firmware-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'
      - run: |
          arduino-cli core update-index
          arduino-cli core install arduino:mbed_nano@4.6.0
          arduino-cli lib install ArduinoBLE@2.1.1 Arduino_APDS9960@1.0.4 Arduino_BMI270_BMM150@1.2.4
      - run: bash scripts/compile-firmware.sh
